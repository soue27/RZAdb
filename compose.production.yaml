name: rzadb

services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${RZADB_UID:-10001}
        APP_GID: ${RZADB_GID:-10001}
    restart: unless-stopped
    init: true
    user: "${RZADB_UID:-10001}:${RZADB_GID:-10001}"
    env_file:
      - .env.production
    environment:
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    command:
      ["uvicorn", "app.presentation.app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${WEB_CONCURRENCY:-1}"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${RZADB_DATA_ROOT:-/srv/rzadb}/uploads:/app/data/uploads
      - ${RZADB_DATA_ROOT:-/srv/rzadb}/backups:/app/data/backups
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
