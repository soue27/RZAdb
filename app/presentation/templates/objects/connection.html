<div class="object-card">
    <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
        <div>
            <div class="text-body-secondary small mb-1">
                Присоединение
            </div>

            <h2 class="h4 mb-0">
                {{ connection.dispatch_name }}
            </h2>
        </div>

        <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-primary" disabled>
                <span class="material-icons align-middle me-1">edit</span>
                Изменить
            </button>

            <button type="button" class="btn btn-outline-secondary" disabled>
                <span class="material-icons align-middle">more_horiz</span>
            </button>
        </div>
    </div>

    <dl class="rzadb-property-list">
        <div class="rzadb-property-row">
            <dt class="rzadb-property-label">SAP</dt>
            <dd class="rzadb-property-value">
                {{ connection.sap_code or "—" }}
            </dd>
        </div>

        <div class="rzadb-property-row">
            <dt class="rzadb-property-label">АСУЕО</dt>
            <dd class="rzadb-property-value">
                {{ connection.asureo_code or "—" }}
            </dd>
        </div>

        <div class="rzadb-property-row">
            <dt class="rzadb-property-label">Подчинённость РДУ</dt>
            <dd class="rzadb-property-value">
                {% if connection.rdu_subordination %}
                    Да
                {% else %}
                    Нет
                {% endif %}
            </dd>
        </div>
    </dl>
</div>
