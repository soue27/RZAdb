<div class="object-card">
    <div class="d-flex align-items-center mb-3">
        <h2 class="h5 mb-0">{{ form_title | default("Добавление присоединения") }}</h2>
    </div>
    {% if error_message %}<div class="alert alert-danger" role="alert">{{ error_message }}</div>{% endif %}
    {% set values = form_values or {} %}
    <form method="post"
      action="{{ form_action | default('/objects/substation/' ~ substation_id ~ '/connections') }}"
      hx-post="{{ form_action | default('/objects/substation/' ~ substation_id ~ '/connections') }}"
      hx-on::before-swap="if (event.detail.xhr.status === 422) event.detail.shouldSwap = true"
      hx-target="#object-content" hx-swap="innerHTML">
        <div class="mb-3">
            <label class="form-label" for="connection-dispatch-name">Диспетчерское наименование</label>
            <input id="connection-dispatch-name" name="dispatch_name" type="text"
                   class="form-control" maxlength="255" required
                   value="{{ values.get('dispatch_name', '') }}">
        </div>
        <div class="mb-3">
            <label class="form-label" for="connection-rdu-subordination">Подчинённость РДУ</label>
            <select id="connection-rdu-subordination" name="rdu_subordination" class="form-select" required>
                <option value="" disabled {% if values.get('rdu_subordination', '') == '' %}selected{% endif %}>Выберите значение</option>
                <option value="true" {% if values.get('rdu_subordination') in [true, 'true', 'True', '1'] %}selected{% endif %}>Да</option>
                <option value="false" {% if values.get('rdu_subordination') in [false, 'false', 'False', '0'] %}selected{% endif %}>Нет</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label" for="connection-sap-code">SAP</label>
            <input id="connection-sap-code" name="sap_code" type="text" class="form-control"
                   maxlength="64" value="{{ values.get('sap_code', '') }}">
        </div>
        <div class="mb-3">
            <label class="form-label" for="connection-asureo-code">АСУЕО</label>
            <input id="connection-asureo-code" name="asureo_code" type="text" class="form-control"
                   maxlength="64" value="{{ values.get('asureo_code', '') }}">
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
                {{ submit_label | default("Создать присоединение") }}
            </button>
            <button type="button" class="btn btn-outline-secondary"
                    hx-get="{{ cancel_url | default('/objects/substation/' ~ substation_id) }}"
                    hx-target="#object-content" hx-swap="innerHTML">Отмена</button>
        </div>
    </form>
</div>
