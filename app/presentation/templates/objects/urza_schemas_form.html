<div id="urza-tab-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="rzadb-otd-version-title">
            Добавление схемы
        </div>

        <button
            type="button"
            class="btn btn-outline-secondary"
            hx-get="/objects/urza/{{ urza_id }}/schemas"
            hx-target="#urza-tab-content"
            hx-swap="outerHTML"
        >
            Отмена
        </button>
    </div>

    <form
        method="post"
        enctype="multipart/form-data"
        hx-post="/objects/urza/{{ urza_id }}/schemas"
        hx-target="#urza-tab-content"
        hx-swap="outerHTML"
    >
        <div class="mb-3">
            <label for="schema_number" class="form-label">
                № схемы <span class="text-danger">*</span>
            </label>
            <input
                type="text"
                class="form-control"
                id="schema_number"
                name="schema_number"
                required
            >
        </div>

        <div class="mb-3">
            <label for="schema_name" class="form-label">
                Наименование <span class="text-danger">*</span>
            </label>
            <input
                type="text"
                class="form-control"
                id="schema_name"
                name="schema_name"
                required
            >
        </div>

        <div class="mb-3">
            <label for="change_description" class="form-label">
                Описание изменения <span class="text-danger">*</span>
            </label>
            <textarea
                class="form-control"
                id="change_description"
                name="change_description"
                rows="3"
                required
            ></textarea>
        </div>

        <div class="mb-3">
            <label for="change_justification" class="form-label">
                Обоснование изменения <span class="text-danger">*</span>
            </label>
            <textarea
                class="form-control"
                id="change_justification"
                name="change_justification"
                rows="3"
                required
            ></textarea>
        </div>

        <div class="mb-3">
            <label for="upload_date" class="form-label">
                Дата загрузки <span class="text-danger">*</span>
            </label>
            <input
                type="date"
                class="form-control"
                id="upload_date"
                name="upload_date"
                required
            >
        </div>

        <div class="mb-3">
            <label for="scan_file" class="form-label">
                Скан схемы
            </label>
            <input
                type="file"
                class="form-control"
                id="scan_file"
                name="scan_file"
            >
        </div>

        <div class="mb-3">
            <label for="editable_file" class="form-label">
                Редактируемый файл
            </label>
            <input
                type="file"
                class="form-control"
                id="editable_file"
                name="editable_file"
            >
        </div>

        <div class="mb-3">
            <label for="signed_form_file" class="form-label">
                Подписанная форма <span class="text-danger">*</span>
            </label>
            <input
                type="file"
                class="form-control"
                id="signed_form_file"
                name="signed_form_file"
                required
            >
        </div>

        <div class="d-flex gap-2">
            <button
                type="submit"
                class="btn btn-primary"
            >
                <span class="material-icons align-middle me-1">save</span>
                Добавить схему
            </button>

            <button
                type="button"
                class="btn btn-outline-secondary"
                hx-get="/objects/urza/{{ urza_id }}/schemas"
                hx-target="#urza-tab-content"
                hx-swap="outerHTML"
            >
                Отмена
            </button>
        </div>
    </form>
</div>
