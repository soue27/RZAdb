
<div class="object-card">
    <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
        <div>
            <div class="text-body-secondary small mb-1">
                Производственное отделение
            </div>
            <h2 class="h4 mb-0">{{ department.full_name }}</h2>
        </div>

        <div class="d-flex gap-2 flex-wrap justify-content-end">
            {% if can_create_substation %}
            <a class="btn btn-primary"
               href="/objects/department/{{ department.id }}/substations/new"
               hx-get="/objects/department/{{ department.id }}/substations/new"
               hx-target="#object-content"
               hx-swap="innerHTML">
                <span class="material-icons align-middle me-1">add</span>
                Добавить подстанцию
            </a>
            {% endif %}
        </div>
    </div>

    <dl class="rzadb-property-list">
        <div class="rzadb-property-row">
            <dt class="rzadb-property-label">Краткое название</dt>
            <dd class="rzadb-property-value">
                {{ department.short_name }}
            </dd>
        </div>

        <div class="rzadb-property-row">
            <dt class="rzadb-property-label">SAP</dt>
            <dd class="rzadb-property-value">
                {{ department.sap_code or "—" }}
            </dd>
        </div>
    </dl>

    {% if can_edit_department %}
    <div class="mt-3">
        <a class="btn btn-outline-primary"
           href="/objects/department/{{ department.id }}/edit"
           hx-get="/objects/department/{{ department.id }}/edit"
           hx-target="#object-content"
           hx-swap="innerHTML">
            <span class="material-icons align-middle me-1">edit</span>
            Изменить
        </a>
    </div>
    {% endif %}
</div>
