<div class="object-card">
    <!-- =========================================================
         HEADER
         ========================================================= -->
    <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
        <div>
            <div class="text-body-secondary small mb-1">
                Подстанция
            </div>

            <h2 class="h4 mb-0">
                {{ substation.dispatch_name }}
            </h2>
        </div>

        <div class="d-flex gap-2">
            <button
                type="button"
                class="btn btn-outline-primary"
                disabled
            >
                <span class="material-icons align-middle me-1">
                    edit
                </span>
                Изменить
            </button>

            <button
                type="button"
                class="btn btn-outline-secondary"
                disabled
            >
                <span class="material-icons align-middle">
                    more_horiz
                </span>
            </button>
        </div>
    </div>


    <!-- =========================================================
         TABS
         ========================================================= -->
    <ul
        class="nav nav-tabs rzadb-tabs mb-4"
        data-rzadb-tabs
    >
        <li class="nav-item">
            <button
                type="button"
                class="nav-link active"
                data-rzadb-tab
                hx-get="/objects/substation/{{ substation.id }}/details"
                hx-target="#substation-tab-content"
                hx-swap="innerHTML"
            >
                Основные сведения
            </button>
        </li>

        <li class="nav-item">
            <button
                type="button"
                class="nav-link"
                data-rzadb-tab
                hx-get="/objects/substation/{{ substation.id }}/inspections"
                hx-target="#substation-tab-content"
                hx-swap="innerHTML"
            >
                Осмотры
            </button>
        </li>

        <li class="nav-item">
            <button
                type="button"
                class="nav-link"
                data-rzadb-tab
                disabled
            >
                Инструкции
            </button>
        </li>

        <li class="nav-item">
            <button
                type="button"
                class="nav-link"
                data-rzadb-tab
                disabled
            >
                Схемы селективности
            </button>
        </li>
    </ul>


    <!-- =========================================================
         TAB CONTENT
         ========================================================= -->
    <div id="substation-tab-content">
        {% include "objects/substation_details.html" %}
    </div>
</div>
