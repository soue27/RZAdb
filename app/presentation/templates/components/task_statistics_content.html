<div class="task-statistics-grid">
    <div class="task-statistic">
        <span class="task-statistic-label">В работе</span>
        <strong class="task-statistic-value">{{ statistics.in_progress }}</strong>
    </div>
    <div class="task-statistic">
        <span class="task-statistic-label">На рассмотрении</span>
        <strong class="task-statistic-value">{{ statistics.under_review }}</strong>
    </div>
    <div class="task-statistic">
        <span class="task-statistic-label">Просрочено</span>
        <strong class="task-statistic-value">{{ statistics.overdue }}</strong>
    </div>
    <div class="task-statistic">
        <span class="task-statistic-label">Завершено за всё время</span>
        <strong class="task-statistic-value">{{ statistics.closed }}</strong>
    </div>
</div>
